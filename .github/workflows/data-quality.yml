name: Data Quality CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  data-quality-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1

      - name: Prepare CI fixture data
        run: |
          mkdir -p data/raw
          cp tests/fixtures/raw/*.csv data/raw/

      - name: Run analytics pipeline
        run: |
          python src/run_pipeline.py

      - name: Build analytics database
        run: |
          python src/build_analytics_database.py

      - name: Run automated data quality tests
        run: |
          pytest tests/test_data_quality.py -v